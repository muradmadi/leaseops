<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LeaseOps — RevOps & MCDA Lead Scoring for Apartment Hunting</title>
    <meta name="description" content="An autonomous Progressive Web App designed to eliminate emotional fatigue and cognitive overload from apartment hunting with mathematical lead scoring." />
    
    <!-- PWA & Mobile Theme Metatags -->
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LeaseOps" />
    
    <!-- Favicon. The manifest link is injected by vite-plugin-pwa (see vite.config.ts) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Fonts are self-hosted and imported from src/main.tsx. Do not link a
         stylesheet from fonts.googleapis.com here: it would reintroduce a
         third-party request on every load and force the CSP open again. -->
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
